name: CI

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hecole.Mediator.slnx

      - name: Build
        run: dotnet build Hecole.Mediator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Hecole.Mediator.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Hecole.Mediator/Hecole.Mediator.csproj --configuration Release --no-build --output artifacts/nupkg

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/nupkg/*.nupkg
            artifacts/nupkg/*.snupkg
          if-no-files-found: error
